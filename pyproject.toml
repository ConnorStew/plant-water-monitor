[project]
name = "water-monitor"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "RPi.GPIO",
    "rich",
    "simpleaudio",
    "pydub"
]

[project.scripts]
water-monitor = "water_monitor.__main__:main"
play-sound = "water_monitor.play_sound:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
